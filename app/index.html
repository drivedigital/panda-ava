<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crimson Tiger Guardia — Rigged & Animated</title>
  <style>
    :root {
      --bg: #14161c;
      --panel: #1d2029;
      --panel2: #232734;
      --text: #e8e6df;
      --muted: #9aa0b0;
      --accent: #ff7a2f;
      --accent2: #c9491d;
      --line: #2e3342;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font: 13px/1.45 -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #app { display: grid; grid-template-columns: 292px 1fr; height: 100%; }
    /* ---------- sidebar ---------- */
    #sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex;
      flex-direction: column; min-height: 0; }
    #sidebar header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
    #sidebar h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
    #sidebar h1 .sub { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 2px; }
    #anim-list { overflow-y: auto; flex: 1; padding: 8px 8px 20px; }
    .cat { margin-bottom: 4px; }
    .cat-head { display: flex; align-items: center; gap: 6px; padding: 7px 8px; cursor: pointer;
      color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
      border-radius: 6px; user-select: none; }
    .cat-head:hover { background: var(--panel2); color: var(--text); }
    .cat-head .chev { transition: transform 0.15s; font-size: 9px; }
    .cat.closed .chev { transform: rotate(-90deg); }
    .cat.closed .cat-body { display: none; }
    .cat-body { padding: 2px 0 6px; }
    .anim-btn { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
      padding: 6px 10px 6px 22px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
    .anim-btn:hover { background: var(--panel2); }
    .anim-btn.active { background: linear-gradient(90deg, var(--accent2), var(--accent)); color: #fff; font-weight: 600; }
    .anim-btn .dur { float: right; color: var(--muted); font-size: 10.5px; }
    .anim-btn.active .dur { color: #ffe2d1; }
    /* ---------- viewport ---------- */
    #stage { position: relative; min-width: 0; }
    canvas { display: block; }
    #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center;
      padding: 10px 14px; background: linear-gradient(180deg, rgba(16,18,24,0.85), rgba(16,18,24,0));
      pointer-events: none; }
    #topbar > * { pointer-events: auto; }
    .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
      display: flex; align-items: center; gap: 8px; }
    .chip label { color: var(--muted); font-size: 11.5px; }
    .chip input[type="range"] { width: 90px; accent-color: var(--accent); }
    .chip input[type="checkbox"] { accent-color: var(--accent); }
    #now-playing { font-weight: 600; color: #fff; background: rgba(201,73,29,0.85); border-color: transparent; }
    #now-playing:empty { display: none; }
    /* ---------- ai box ---------- */
    #ai-box { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 8px; width: min(430px, 60%); }
    #ai-input { flex: 1; background: rgba(29,32,41,0.92); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; font-size: 13px; outline: none; }
    #ai-input:focus { border-color: var(--accent); }
    #ai-send { background: linear-gradient(90deg, var(--accent2), var(--accent)); color: #fff; border: 0;
      border-radius: 10px; padding: 0 16px; font-weight: 700; cursor: pointer; }
    #ai-send:disabled { opacity: 0.5; cursor: default; }
    #ai-hint { position: absolute; left: 16px; bottom: 60px; color: var(--muted); font-size: 11px;
      background: rgba(29,32,41,0.8); padding: 4px 8px; border-radius: 6px; }
    /* ---------- loading ---------- */
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: var(--bg); z-index: 10; transition: opacity 0.4s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .bar { width: 240px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
    #loading .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
    #loading .tiger { font-size: 34px; }
    #errbox { position: absolute; right: 14px; bottom: 14px; max-width: 46%; background: #4c1d1d; color: #ffd7d7;
      border: 1px solid #7a2f2f; border-radius: 8px; padding: 10px 12px; font-size: 12px; display: none; white-space: pre-wrap; }
    @media (max-width: 760px) {
      #app { grid-template-columns: 1fr; }
      #sidebar { position: absolute; z-index: 5; width: 292px; height: 100%; transform: translateX(-100%); transition: transform .2s; }
      #sidebar.open { transform: none; }
      #menu-btn { display: block; }
    }
    #menu-btn { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <header>
        <h1>🐯 Crimson Tiger Guardia
          <span class="sub">rigged · 41 animations · spring-bone physics</span>
        </h1>
      </header>
      <div id="anim-list"></div>
    </aside>
    <main id="stage">
      <div id="topbar">
        <button id="menu-btn" class="chip">☰</button>
        <div class="chip" id="now-playing"></div>
        <div class="chip"><label>Speed</label><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"><span id="speed-val">1.0×</span></div>
        <div class="chip"><label>Physics</label><input id="physics-on" type="checkbox" checked></div>
        <div class="chip"><label>Wind</label><input id="wind" type="range" min="0" max="1" step="0.05" value="0"></div>
        <div class="chip"><label title="Show spring bones & colliders">Debug</label><input id="debug-on" type="checkbox"></div>
        <div class="chip"><label title="Auto rotate camera">Turntable</label><input id="turntable" type="checkbox"></div>
      </div>
      <div id="ai-hint">Try: “do a spinning kick”, “draw the sword”, “hip throw”…</div>
      <div id="ai-box">
        <input id="ai-input" placeholder="Command the tiger… (AI picks an animation)" />
        <button id="ai-send">Go</button>
      </div>
      <div id="loading"><div class="tiger">🐯</div><div class="bar"><div id="load-bar"></div></div><div id="load-msg">loading model…</div></div>
      <div id="errbox"></div>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
